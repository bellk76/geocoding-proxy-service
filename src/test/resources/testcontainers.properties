# Настройки клиента Testcontainers (читаются автоматически)
#
# Ryuk — вспомогательный контейнер для очистки ресурсов после тестов.
# В rootless-режиме Podman он падает с ошибкой прав доступа, поэтому отключён:
# очистку контейнеров выполняет shutdown hook Testcontainers при завершении JVM.
ryuk.disabled=true
